<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6efe2">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="重慶行程">
  <title>重慶・六天五夜｜地圖</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a8563d'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='serif'%3E渝%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="map-page">
  <header class="topbar">
    <div class="brand">
      <h1>重慶・六天五夜</h1>
      <span>2026.10.02 – 10.07</span>
    </div>
    <nav aria-label="頁面">
      <a class="active" href="index.html" aria-current="page">地圖</a>
      <a href="itinerary.html">行程表</a>
    </nav>
  </header>

  <div class="chips" id="dayFilters" role="group" aria-label="選擇日期"></div>

  <main class="map-main">
    <section class="map-shell" aria-label="地圖">
      <div id="map"></div>
      <div id="mapStatus" class="map-status"></div>
      <div id="basemap" class="basemap"></div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <div>
          <h2 id="listTitle">全部行程</h2>
          <span id="placeCount"></span>
        </div>
        <label class="toggle"><input id="routeToggle" type="checkbox" checked>順序連線</label>
      </div>
      <div id="placeList"></div>
      <p class="footnote">點清單中的地點可在地圖上定位。「高德地圖」會用已核對的座標直接開啟高德 App；標示「高德搜尋」的地點則用名稱搜尋。</p>
    </aside>
  </main>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
